# Whole stack: `docker compose up --build`, then open http://localhost:4200
# Nothing but Docker is needed on the host. Settings come from .env (copy .env.example).

name: doable

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doable}
      POSTGRES_USER: ${POSTGRES_USER:-doable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doable}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-doable}
      DB_USER: ${POSTGRES_USER:-doable}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-doable}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      TZ: ${TZ:-UTC}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Database viewer in the browser: http://localhost:8081
  # Log in with System "PostgreSQL", Server "db" and the POSTGRES_* values from .env.
  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
