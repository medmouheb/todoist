# Development mode: the frontend runs `ng serve` with live reload instead of nginx.
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
# Edit files under frontend/src and the browser refreshes. node_modules stays in a
# Docker volume, so nothing is installed on your machine.

services:
  frontend:
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx ng serve --host 0.0.0.0 --port 4200 --poll 1000 --proxy-config proxy.conf.json"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "${FRONTEND_PORT:-4200}:4200"

volumes:
  frontend_node_modules:
