# Render Blueprint: in the Render dashboard choose New → Blueprint and pick this repository.
# It creates one free web service from /Dockerfile. See deploy/DEPLOY-RENDER.md.
services:
  - type: web
    name: doable
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS us-east-2, Ohio).
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Doesn't touch the database, so Render's checks don't keep the free Neon database awake.
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    envVars:
      # Your Neon connection string: postgresql://user:password@host/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Render generates a random secret for signing logins.
      - key: JWT_SECRET
        generateValue: true
      # Email: either a Gmail account (deploy/GMAIL.md) or Brevo (deploy/DEPLOY-RENDER.md).
      # MAIL_FROM is the sender, e.g. Doable <you@gmail.com>. Leave all empty to run without email.
      - key: MAIL_FROM
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      # No SMTP on Render's free plan.
      - key: MAIL_HOST
        value: ""
      - key: TZ
        value: UTC
      # New accounts confirm their email with a code before logging in. This needs working email
      # (Gmail or Brevo); set to "false" to let testers in without email until it is set up.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
