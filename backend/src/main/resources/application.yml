spring:
  application:
    name: doable
  datasource:
    # Or set DATABASE_URL=postgresql://user:password@host/db (see config/DatabaseUrlEnvironment)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doable}
    username: ${DB_USER:doable}
    password: ${DB_PASSWORD:doable}
    hikari:
      # Small pool: free database plans allow few connections.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  servlet:
    multipart:
      max-file-size: 2MB

server:
  # Hosts like Render tell the app which port to use through PORT.
  port: ${PORT:8080}

doable:
  # Render sets RENDER_EXTERNAL_URL to the service's public address.
  app-url: ${APP_URL:${RENDER_EXTERNAL_URL:http://localhost:4200}}
  # With a Brevo API key, emails go through Brevo's HTTPS API instead of SMTP
  # (Render's free plan blocks SMTP).
  brevo-api-key: ${BREVO_API_KEY:}
  # Or send from a Gmail account through the Gmail API (HTTPS, so it also works on Render's free
  # plan). Takes priority over Brevo and SMTP. See deploy/GMAIL.md for getting these three values.
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    refresh-token: ${GMAIL_REFRESH_TOKEN:}
  # New accounts confirm their email with a code before they can log in. Needs working email
  # (Mailpit locally, Brevo or SMTP when hosted); set to false to switch it off.
  require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
  mail-from: ${MAIL_FROM:Doable <no-reply@doable.local>}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-of-32-plus-chars}
    ttl-hours: ${JWT_TTL_HOURS:168}

management:
  endpoint:
    health:
      # /actuator/health/liveness answers without touching the database, so health checks
      # don't keep a sleeping free database awake.
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
